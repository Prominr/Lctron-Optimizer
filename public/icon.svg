<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Black background -->
  <rect width="256" height="256" fill="#0a0a0a"/>

  <!-- Mast -->
  <rect x="124" y="48" width="8" height="120" fill="#ff2020"/>

  <!-- Main sail (right, large triangle) -->
  <polygon points="132,52 132,148 210,148" fill="#ff2020"/>

  <!-- Shadow sail (left, smaller darker triangle) -->
  <polygon points="128,56 128,140 80,140" fill="#8b0000"/>

  <!-- Hull (trapezoid) -->
  <polygon points="72,148 184,148 196,172 60,172" fill="#ff2020"/>

  <!-- Wave 1 (bright) -->
  <path d="M0,195 Q20,182 40,195 Q60,208 80,195 Q100,182 120,195 Q140,208 160,195 Q180,182 200,195 Q220,208 240,195 Q248,191 256,195" 
        stroke="#ff2020" stroke-width="3.5" fill="none"/>

  <!-- Wave 2 (bright) -->
  <path d="M0,210 Q20,197 40,210 Q60,223 80,210 Q100,197 120,210 Q140,223 160,210 Q180,197 200,210 Q220,223 240,210 Q248,206 256,210" 
        stroke="#ff2020" stroke-width="3.5" fill="none"/>

  <!-- Wave 3 (dark reflection) -->
  <path d="M0,225 Q20,215 40,225 Q60,235 80,225 Q100,215 120,225 Q140,235 160,225 Q180,215 200,225 Q220,235 240,225 Q248,222 256,225" 
        stroke="#8b0000" stroke-width="2.5" fill="none"/>

  <!-- Wave 4 (dark reflection) -->
  <path d="M0,238 Q20,230 40,238 Q60,246 80,238 Q100,230 120,238 Q140,246 160,238 Q180,230 200,238 Q220,246 240,238 Q248,235 256,238" 
        stroke="#8b0000" stroke-width="2.5" fill="none"/>
</svg>
